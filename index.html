<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Events | Agenda</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <div class="container flex-nav">
        <a href="index.html" class="logo">Campus<span>Events</span></a>
        <a href="create.html" class="btn-create">Créer un événement</a>
    </div>
</header>

<section class="hero">
    <div class="container">
        <div class="hero-inner">
            <div class="hero-tag"><span class="hero-dot"></span> Agenda du campus</div>
            <h1>Tous vos <em>événements</em><br>en un coup d'œil</h1>
            <p>Hackathons, conférences, concerts… ne ratez plus rien.</p>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Rechercher un événement, un lieu...">
                <button onclick="searchEvents()">Rechercher</button>
            </div>
        </div>
    </div>
</section>

<div class="container">
    <div class="app-layout">

        <!-- ── Sidebar ── -->
        <aside class="sidebar">
            <!-- Mini calendrier -->
            <div class="mini-cal">
                <div class="cal-header">
                    <button class="cal-nav" onclick="changeMonth(-1)">‹</button>
                    <span class="cal-month" id="calMonth"></span>
                    <button class="cal-nav" onclick="changeMonth(1)">›</button>
                </div>
                <div class="cal-grid" id="calGrid"></div>
            </div>

            <!-- Filtres -->
            <div class="sidebar-section">
                <p class="sidebar-title">Catégories</p>
                <div class="filter-list">
                    <button class="filter-item active" onclick="filterCat('all', this)">
                        <span class="filter-dot" style="background:linear-gradient(135deg,#7c22d4,#e040fb)"></span>Tous les événements
                    </button>
                    <button class="filter-item" onclick="filterCat('hackathon', this)">
                        <span class="filter-dot" style="background:#7c22d4"></span>Hackathon
                    </button>
                    <button class="filter-item" onclick="filterCat('conférence', this)">
                        <span class="filter-dot" style="background:#a855f7"></span>Conférence
                    </button>
                    <button class="filter-item" onclick="filterCat('concert', this)">
                        <span class="filter-dot" style="background:#e040fb"></span>Concert
                    </button>
                    <button class="filter-item" onclick="filterCat('sport', this)">
                        <span class="filter-dot" style="background:#c084fc"></span>Sport
                    </button>
                    <button class="filter-item" onclick="filterCat('atelier', this)">
                        <span class="filter-dot" style="background:#8b78aa"></span>Atelier
                    </button>
                </div>
            </div>
        </aside>

        <!-- ── Contenu principal ── -->
        <main>
            <div class="agenda-header">
                <h2 class="agenda-title" id="agendaTitle">Événements à venir</h2>
                <div class="view-toggle">
                    <button class="view-btn active" id="btnAgenda" onclick="setView('agenda')">≡ Agenda</button>
                    <button class="view-btn" id="btnGrid" onclick="setView('grid')">⊞ Grille</button>
                </div>
            </div>

            <!-- Vue agenda -->
            <div class="agenda-view" id="agendaView">
                <div id="agendaContent"><div class="empty-state"><div class="empty-icon">📅</div>Chargement...</div></div>
            </div>

            <!-- Vue grille -->
            <div class="grid-view" id="gridView">
                <div id="gridContent"></div>
            </div>
        </main>
    </div>
</div>

<div class="toast" id="toast">
    <span>✓</span><span id="toastMsg">Action effectuée</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ─── Config Supabase ───────────────────────────────────────
const SUPABASE_URL = 'https://rgzabfwwviqpbrsqqlkp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJnemFiZnd3dmlxcGJyc3FxbGtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4MDQ5OTgsImV4cCI6MjA5MTM4MDk5OH0.LH_kfGJEgZsj87P62wJ8JhsUAI4XWXTgVFP1KargpE4';
// ──────────────────────────────────────────────────────────

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

const IMAGES = [
    'https://images.unsplash.com/photo-1504384308090-c894fdcc538d?auto=format&fit=crop&q=80&w=600',
    'https://images.unsplash.com/photo-1540575467063-178a50c2df87?auto=format&fit=crop&q=80&w=600',
    'https://images.unsplash.com/photo-1501281668745-f7f57925c3b4?auto=format&fit=crop&q=80&w=600',
    'https://images.unsplash.com/photo-1531058020387-3be344556be6?auto=format&fit=crop&q=80&w=600',
    'https://images.unsplash.com/photo-1515187029135-18ee286d815b?auto=format&fit=crop&q=80&w=600',
];

let allEvents = [];
let currentView = 'agenda';
let calDate = new Date();

// ── Helpers ──────────────────────────────────────────────

function getImg(id) { return IMAGES[id % IMAGES.length]; }

function fmtDate(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
}
function fmtDayNum(dateStr) {
    return new Date(dateStr + 'T00:00:00').getDate();
}
function fmtWeekday(dateStr) {
    return new Date(dateStr + 'T00:00:00').toLocaleDateString('fr-FR', { weekday: 'short' });
}

function isToday(dateStr) {
    const today = new Date();
    const d = new Date(dateStr + 'T00:00:00');
    return d.toDateString() === today.toDateString();
}

function showToast(msg) {
    const t = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2600);
}

// ── Mini calendrier ───────────────────────────────────────

function renderCal() {
    const year  = calDate.getFullYear();
    const month = calDate.getMonth();
    const mois  = calDate.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
    document.getElementById('calMonth').textContent = mois.charAt(0).toUpperCase() + mois.slice(1);

    const eventDates = new Set(allEvents.map(e => e.date));
    const today = new Date();

    const firstDay = new Date(year, month, 1).getDay(); // 0=dim
    const offset   = (firstDay + 6) % 7;               // lundi = 0
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    const days = ['L','M','M','J','V','S','D'];
    let html = days.map(d => `<div class="cal-day-name">${d}</div>`).join('');

    for (let i = 0; i < offset; i++) html += `<div class="cal-day empty"></div>`;

    for (let d = 1; d <= daysInMonth; d++) {
        const pad  = String(month + 1).padStart(2, '0');
        const dPad = String(d).padStart(2, '0');
        const iso  = `${year}-${pad}-${dPad}`;
        const isT  = today.getFullYear() === year && today.getMonth() === month && today.getDate() === d;
        const hasE = eventDates.has(iso);
        html += `<div class="cal-day ${isT ? 'today' : ''} ${hasE ? 'has-event' : ''}" onclick="jumpToDate('${iso}')">${d}</div>`;
    }

    document.getElementById('calGrid').innerHTML = html;
}

function changeMonth(dir) {
    calDate = new Date(calDate.getFullYear(), calDate.getMonth() + dir, 1);
    renderCal();
}

function jumpToDate(iso) {
    const el = document.getElementById('day-' + iso);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ── Rendu agenda ──────────────────────────────────────────

function groupByDate(events) {
    const map = {};
    events.forEach(e => {
        if (!map[e.date]) map[e.date] = [];
        map[e.date].push(e);
    });
    return map;
}

function renderAgenda(events) {
    const container = document.getElementById('agendaContent');
    if (!events.length) {
        container.innerHTML = `<div class="empty-state"><div class="empty-icon">📅</div>Aucun événement trouvé. <a href="create.html">Créez-en un !</a></div>`;
        return;
    }

    const groups = groupByDate(events);
    const sortedDates = Object.keys(groups).sort();

    container.innerHTML = sortedDates.map(date => {
        const dayEvents = groups[date];
        const todayClass = isToday(date) ? 'today-num' : '';

        const cards = dayEvents.map((ev, i) => `
            <div class="agenda-card" style="animation-delay:${i * 0.06}s" onclick="window.location='details.html?id=${ev.id}'">
                <div class="agenda-card-accent"></div>
                <div class="agenda-card-img" style="background-image:url('${getImg(ev.id)}')"></div>
                <div class="agenda-card-body">
                    <p class="agenda-time">${ev.time ? '⏰ ' + ev.time : 'Toute la journée'}</p>
                    <h3>${ev.title}</h3>
                    <p class="agenda-loc">${ev.location || '—'}</p>
                    ${ev.description ? `<p class="agenda-desc">${ev.description}</p>` : ''}
                </div>
                <div class="agenda-card-right">
                    <span class="price-badge">Gratuit</span>
                    <button class="btn-delete" onclick="event.stopPropagation(); deleteEvent(${ev.id})">Supprimer</button>
                </div>
            </div>
        `).join('');

        return `
            <div class="day-group" id="day-${date}">
                <div class="day-label">
                    <div class="day-date-block">
                        <span class="day-num ${todayClass}">${fmtDayNum(date)}</span>
                        <span class="day-wd">${fmtWeekday(date)}</span>
                    </div>
                    <div class="day-line"></div>
                </div>
                ${cards}
            </div>
        `;
    }).join('');
}

// ── Rendu grille ──────────────────────────────────────────

function renderGrid(events) {
    const container = document.getElementById('gridContent');
    if (!events.length) {
        container.innerHTML = `<div class="empty-state"><div class="empty-icon">📅</div>Aucun événement. <a href="create.html">Créez-en un !</a></div>`;
        return;
    }
    container.innerHTML = events.map((ev, i) => `
        <div class="eb-card" style="animation-delay:${i * 0.05}s" onclick="window.location='details.html?id=${ev.id}'">
            <div class="eb-card-img" style="background-image:url('${getImg(ev.id)}')">
                <span class="eb-card-badge">Campus</span>
            </div>
            <div class="eb-card-info">
                <p class="date">${fmtDate(ev.date)} · ${ev.time || ''}</p>
                <h3>${ev.title}</h3>
                <p class="loc">${ev.location || ''}</p>
                <div class="eb-card-footer">
                    <span class="price-badge">Gratuit</span>
                    <button onclick="event.stopPropagation(); deleteEvent(${ev.id})" class="btn-delete">Supprimer</button>
                </div>
            </div>
        </div>
    `).join('');
}

function renderAll(events) {
    renderAgenda(events);
    renderGrid(events);
    renderCal();
}

// ── Chargement Supabase ───────────────────────────────────

async function loadEvents() {
    const { data, error } = await db
        .from('events')
        .select('*')
        .order('date', { ascending: true });

    if (error) {
        document.getElementById('agendaContent').innerHTML =
            `<div class="empty-state">Erreur de connexion à Supabase.</div>`;
        return;
    }

    allEvents = data;
    document.getElementById('agendaTitle').textContent =
        `${data.length} événement${data.length > 1 ? 's' : ''} à venir`;
    renderAll(data);
}

// ── Filtres ───────────────────────────────────────────────

function filterCat(cat, btn) {
    document.querySelectorAll('.filter-item').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const filtered = cat === 'all'
        ? allEvents
        : allEvents.filter(e =>
            e.title?.toLowerCase().includes(cat) ||
            e.description?.toLowerCase().includes(cat)
          );
    renderAll(filtered);
}

function searchEvents() {
    const q = document.getElementById('searchInput').value.toLowerCase().trim();
    const filtered = !q ? allEvents : allEvents.filter(e =>
        e.title?.toLowerCase().includes(q) ||
        e.location?.toLowerCase().includes(q) ||
        e.description?.toLowerCase().includes(q)
    );
    renderAll(filtered);
    document.getElementById('agendaTitle').textContent =
        q ? `${filtered.length} résultat${filtered.length > 1 ? 's' : ''} pour "${q}"` : `${allEvents.length} événements à venir`;
}

// ── Suppression ───────────────────────────────────────────

async function deleteEvent(id) {
    if (!confirm('Supprimer cet événement ?')) return;
    const { error } = await db.from('events').delete().eq('id', id);
    if (error) { showToast('Erreur lors de la suppression'); return; }
    showToast('Événement supprimé');
    loadEvents();
}

// ── Vue toggle ────────────────────────────────────────────

function setView(v) {
    currentView = v;
    document.getElementById('agendaView').classList.toggle('hidden', v !== 'agenda');
    document.getElementById('gridView').classList.toggle('active',  v === 'grid');
    document.getElementById('btnAgenda').classList.toggle('active', v === 'agenda');
    document.getElementById('btnGrid').classList.toggle('active',   v === 'grid');
}

// ── Init ──────────────────────────────────────────────────

document.getElementById('searchInput').addEventListener('keyup', e => {
    if (e.key === 'Enter') searchEvents();
});

window.onload = loadEvents;
</script>
</body>
</html>
