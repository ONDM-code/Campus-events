<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un événement | Campus Events</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <div class="container flex-nav">
        <a href="index.html" class="logo">Campus<span>Events</span></a>
        <a href="index.html" class="btn-cancel" style="font-size:14px;font-weight:600;color:var(--muted);padding:9px 16px;border-radius:99px;transition:background .15s">← Retour à l'agenda</a>
    </div>
</header>

<main class="container">
    <div class="form-wrapper">
        <div class="form-header">
            <h1>Créer un événement</h1>
            <p>Renseignez les informations et publiez dans l'agenda du campus.</p>
        </div>

        <div class="form-card">
            <p class="form-section-title">Informations de base</p>

            <form id="eventForm">
                <div class="form-group">
                    <label for="title">Nom de l'événement</label>
                    <input type="text" id="title" placeholder="Ex : Hackathon de Printemps 2026" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="date">Date</label>
                        <input type="date" id="date" required>
                    </div>
                    <div class="form-group">
                        <label for="time">Heure de début</label>
                        <input type="time" id="time">
                    </div>
                </div>

                <div class="form-group">
                    <label for="location">Lieu</label>
                    <input type="text" id="location" placeholder="Ex : Grande Halle, Amphi B, Stade..." required>
                </div>

                <div class="form-divider"></div>
                <p class="form-section-title">Description</p>

                <div class="form-group">
                    <label for="description">À propos de cet événement</label>
                    <textarea id="description" placeholder="Décrivez votre événement : programme, intervenants, prérequis..."></textarea>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-cancel" onclick="history.back()">Annuler</button>
                    <button type="submit" class="btn-submit" id="submitBtn">
                        <span>Publier dans l'agenda</span>
                        <span>→</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>

<div class="toast" id="toast">
    <span>🎉</span><span id="toastMsg">Événement publié !</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://rgzabfwwviqpbrsqqlkp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJnemFiZnd3dmlxcGJyc3FxbGtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4MDQ5OTgsImV4cCI6MjA5MTM4MDk5OH0.LH_kfGJEgZsj87P62wJ8JhsUAI4XWXTgVFP1KargpE4';

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

// Pré-remplir la date à aujourd'hui
document.getElementById('date').valueAsDate = new Date();

document.getElementById('eventForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerHTML = '<span>Publication en cours...</span>';

    const { error } = await db.from('events').insert({
        title:       document.getElementById('title').value.trim(),
        date:        document.getElementById('date').value,
        time:        document.getElementById('time').value || null,
        location:    document.getElementById('location').value.trim(),
        description: document.getElementById('description').value.trim() || null,
    });

    if (error) {
        btn.disabled = false;
        btn.innerHTML = '<span>Publier dans l\'agenda</span><span>→</span>';
        document.getElementById('toastMsg').textContent = 'Erreur lors de la publication';
        document.getElementById('toast').classList.add('show');
        setTimeout(() => document.getElementById('toast').classList.remove('show'), 2800);
        return;
    }

    document.getElementById('toast').classList.add('show');
    setTimeout(() => window.location.href = 'index.html', 1300);
});
</script>
</body>
</html>
